name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  reek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true
      - name: Run Reek
        run: bundle exec reek --single-line .

  brakeman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true
      - name: Run Brakeman
        run: bundle exec brakeman --except "${{ vars.FEEDER_BRAKEMAN_EXCEPTIONS }}" .

  bundle-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true
      - name: Run Bundle Audit
        run: bundle exec bundle-audit check --update

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true
      - name: Run yaml-lint
        run: bundle exec yaml-lint ./**/*.yml ./.github/**/*.yml

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feeder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get --yes install libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ".ruby-version"
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_MASTER_KEY: ${{ secrets.FEEDER_RAILS_MASTER_KEY_TEST }}
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/feeder_test
          REDIS_URL: redis://localhost:6379/0
          RAILS_ENV: test
          HONEYBADGER_API_KEY: ${{ secrets.FEEDER_HONEYBADGER_API_KEY }}
          FREEFEED_TOKEN: TEST_TOKEN
          FREEFEED_BASE_URL: https://candy.freefeed.net
        run: |
          bundle exec rails db:reset
          bundle exec rspec
